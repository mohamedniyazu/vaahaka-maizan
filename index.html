              <div style={{display:"flex",gap:"10px",flexDirection: c.user_id === session?.user?.id ? "row-reverse" : "row"}}>

                <div style={{maxWidth:"75%",display:"flex",flexDirection:"column",alignItems: c.user_id === session?.user?.id ? "flex-end" : "flex-start"}}>

          {selectedStory.finished && (
            <div style={{marginTop:"24px",background:`linear-gradient(135deg, ${C.mint}22, ${C.tealLight})`,border:`2px solid ${C.mint}`,borderRadius:"16px",padding:"24px",textAlign:"center"}}>

              <p style={{color:C.tealDark,fontWeight:"700",margin:0,fontSize:"16px"}}>{t("storyFinished")}</p>
            </div>

          </div>
        </div>

        {!selectedStory.finished && isMember && session && (
          <div style={{background:C.white,borderTop:`2px solid ${C.tealLight}`,padding:"12px 16px",boxShadow:"0 -4px 20px rgba(10,37,51,0.1)",flexShrink:0}}>
            <div style={{maxWidth:"640px",margin:"0 auto"}}>
              <textarea value={newContrib} onChange={e=>setNewContrib(e.target.value)} placeholder={t("continuePlaceholder")}
                style={{...inputStyle,resize:"none",marginBottom:"10px",border:`1.5px solid ${C.teal}`}} rows={2} />
              <div style={{display:"flex",gap:"8px"}}>
                <button onClick={handleAddContribution} style={{flex:1,background:`linear-gradient(to right, ${C.teal}, ${C.tealDark})`,color:C.white,fontWeight:"700",padding:"11px",borderRadius:"12px",border:"none",cursor:"pointer",fontSize:"13px",boxShadow:`0 4px 12px rgba(13,158,158,0.35)`}}>✍️ {t("submitPart")}</button>
                {isCreator && !selectedStory.finished && <button onClick={handleFinishStory} style={{background:`linear-gradient(to right, ${C.mint}, ${C.teal})`,color:C.navy,fontWeight:"700",padding:"11px 14px",borderRadius:"12px",border:"none",cursor:"pointer",fontSize:"13px"}}>✅ {t("finish")}</button>}
              </div>
            </div>
          </div>
        )}

        {!selectedStory.finished && !session && (
  <div style={{background:C.white,borderTop:"2px solid #E8F7F7",padding:"14px 16px",boxShadow:"0 -4px 20px rgba(10,37,51,0.1)",flexShrink:0}}>
    <div style={{maxWidth:"640px",margin:"0 auto"}}>
      <button onClick={() => setScreen("login")} style={{width:"100%",background:"linear-gradient(to right, #0D9E9E, #0A7A7A)",color:C.white,fontWeight:"700",padding:"12px",borderRadius:"12px",border:"none",cursor:"pointer",fontSize:"13px"}}>{t("loginToAdd")}</button>
    </div>
  </div>
)}
        {showInvite && (
          <div style={{position:"fixed",inset:0,background:"rgba(10,37,51,0.6)",zIndex:50,display:"flex",alignItems:"flex-end",justifyContent:"center",padding:"16px"}}>
            <div style={{background:C.white,borderRadius:"20px",padding:"24px",width:"100%",maxWidth:"512px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px",flexDirection:flip}}>
                <button onClick={() => { setShowInvite(false); setInviteSearch(""); }} style={{background:C.cream,border:"none",color:C.navy,cursor:"pointer",width:"32px",height:"32px",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px"}}>✕</button>
                <h3 style={{color:C.navy,fontWeight:"700",margin:0,fontSize:"16px"}}>{t("inviteMember")}</h3>
              </div>
              <p style={{color:C.gray,fontSize:"12px",textAlign:"center",margin:"0 0 12px"}}>{members.length}/10 · {10-members.length} {t("slotsLeft")}</p>
              <input value={inviteSearch} onChange={e=>setInviteSearch(e.target.value)} placeholder={t("searchName")} style={{...inputStyle,marginBottom:"12px"}} />
              <div style={{maxHeight:"200px",overflowY:"auto",display:"flex",flexDirection:"column",gap:"8px"}}>
                {filteredInvite.length === 0 ? <p style={{color:C.gray,textAlign:"center",padding:"16px",fontSize:"14px"}}>{t("noNameFound")}</p>
                  : filteredInvite.map(u => (
                  <div key={u.id} style={{display:"flex",flexDirection:flip,alignItems:"center",justifyContent:"space-between",background:C.cream,borderRadius:"12px",padding:"12px 16px"}}>
                    <button onClick={() => handleInviteMember(u)} style={{background:`linear-gradient(to right, ${C.teal}, ${C.tealDark})`,color:C.white,fontSize:"12px",padding:"7px 14px",borderRadius:"8px",border:"none",cursor:"pointer",fontWeight:"700"}}>{t("inviteBtn")}</button>
                    <div style={{display:"flex",alignItems:"center",gap:"10px",flexDirection:flip}}>
                      <span style={{fontSize:"14px",color:C.navy,fontWeight:"600"}}>{u.name}</span>
                      <Avatar letter={u.avatar_letter} size={32} bg={C.teal} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  // HOME
  const storyLang = (s) => /[\u0780-\u07BF]/.test((s.title || "") + (s.opening || "")) ? "dv" : "en";
const visibleStories = (activeTab === "public" ? publicStories : groupStories).filter(s => storyLang(s) === lang);
const groupCount = groupStories.filter(s => storyLang(s) === lang).length;
const filteredForCreate = allUsers.filter(u => u.id !== session?.user?.id && u.name?.includes(memberSearch));

  return (
    <div style={{minHeight:"100vh",background:C.cream}}>
      <Notif msg={notification} />
      <div style={{background:`linear-gradient(135deg, ${C.teal}, ${C.navy})`,padding:"14px 20px",position:"sticky",top:0,zIndex:40,boxShadow:"0 2px 16px rgba(10,37,51,0.2)"}}>
        <div style={{maxWidth:"640px",margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display: session ? "flex" : "none",alignItems:"center",gap:"10px"}}>
            <Avatar letter={currentProfile?.avatar_letter || "?"} size={38} bg={C.coral} />
            <div>
              <p style={{fontSize:"11px",color:"rgba(255,255,255,0.7)",margin:0,fontWeight:"600"}}>{t("welcome")}</p>
              <p onClick={() => { setEditNameValue(currentProfile?.name || ""); setShowEditName(true); }} title={t("editName")} style={{fontSize:"13px",fontWeight:"700",color:C.white,margin:0,cursor:"pointer"}}>{currentProfile?.name} <span style={{fontSize:"11px",opacity:0.8}}>✏️</span></p>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
            <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
              <div style={{width:"32px",height:"32px",borderRadius:"50%",background:C.coral,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"18px"}}>📖</div>

            </div>

            <button onClick={() => loadAllData(session)} title={t("refresh")} style={{background:"rgba(255,255,255,0.2)",border:"none",color:C.white,fontSize:"16px",width:"32px",height:"32px",borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"700"}}>↻</button>
            {session && <button onClick={handleLogout} style={{background:"rgba(255,255,255,0.15)",border:"none",color:C.white,fontSize:"11px",padding:"5px 10px",borderRadius:"8px",cursor:"pointer",fontWeight:"600",whiteSpace:"nowrap"}}>{t("logout")}</button>}
            {!session && <button onClick={() => setScreen("login")} style={{background:"rgba(255,255,255,0.15)",border:"none",color:C.white,fontSize:"11px",padding:"5px 10px",borderRadius:"8px",cursor:"pointer",fontWeight:"600",whiteSpace:"nowrap"}}>{t("loginRegister")}</button>}
          </div>
        </div>
      </div>

      <div style={{maxWidth:"640px",margin:"0 auto",padding:"16px 16px 32px"}}>

        {pendingInvites.length > 0 && (
          <div style={{background:`linear-gradient(135deg, ${C.amber}22, ${C.amber}11)`,border:`2px solid ${C.amber}`,borderRadius:"16px",padding:"16px",marginBottom:"16px"}}>
            <h3 style={{color:C.navy,fontWeight:"700",fontSize:"14px",margin:"0 0 12px"}}>🔔 {t("groupInvites")}</h3>
            {pendingInvites.map(invite => (
              <div key={invite.id} style={{display:"flex",flexDirection:flip,alignItems:"center",justifyContent:"space-between",background:C.white,borderRadius:"12px",padding:"12px 16px",marginBottom:"6px"}}>
                <div style={{display:"flex",gap:"8px"}}>
                  <button onClick={() => handleDeclineInvite(invite)} style={{background:C.cream,color:C.gray,fontSize:"12px",padding:"7px 14px",borderRadius:"8px",border:`1.5px solid ${C.lightGray}`,cursor:"pointer",fontWeight:"700"}}>{t("decline")}</button>
                  <button onClick={() => handleAcceptInvite(invite)} style={{background:`linear-gradient(to right, ${C.amber}, #ffcc33)`,color:C.navy,fontSize:"12px",padding:"7px 14px",borderRadius:"8px",border:"none",cursor:"pointer",fontWeight:"700"}}>{t("accept")}</button>
                </div>
                <div style={{textAlign:"start"}}>
                  <p style={{color:C.navy,fontSize:"14px",fontWeight:"700",margin:0}} dir="auto">{invite.stories?.title}</p>
                  <p style={{color:C.gray,fontSize:"12px",margin:0}}>{t("invitedByPre")}{invite.inviter_name}{t("invitedByPost")}</p>
                </div>
              </div>
            ))}
          </div>
        )}

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}>
          <button onClick={() => { if (!session) { setScreen("login"); return; } setShowCreate(true); setCreateType(activeTab); }}
            style={{background: activeTab==="group" ? `linear-gradient(to right, ${C.coral}, ${C.amber})` : `linear-gradient(to right, ${C.teal}, ${C.tealDark})`,color: activeTab==="group" ? C.navy : C.white,fontWeight:"700",padding:"10px 18px",borderRadius:"12px",border:"none",cursor:"pointer",fontSize:"13px",boxShadow: activeTab==="group" ? `0 4px 12px rgba(255,87,87,0.3)` : `0 4px 12px rgba(13,158,158,0.3)`}}>
            {activeTab==="group" ? "👥 " + t("startGroupStory") : "✨ " + t("startStory")}
          </button>
          <div style={{display:"flex",background:C.white,borderRadius:"12px",overflow:"hidden",boxShadow:"0 2px 8px rgba(10,37,51,0.1)",border:`1.5px solid ${C.lightGray}`}}>
            <button onClick={() => setActiveTab("public")} style={{padding:"8px 14px",fontSize:"12px",fontWeight:"700",background: activeTab==="public" ? C.teal : "transparent",color: activeTab==="public" ? C.white : C.gray,border:"none",cursor:"pointer"}}>🌐 {t("publicTab")}</button>
            <button onClick={() => { if (!session) { setScreen("login"); return; } setActiveTab("group"); }} style={{padding:"8px 14px",fontSize:"12px",fontWeight:"700",background: activeTab==="group" ? C.coral : "transparent",color: activeTab==="group" ? C.white : C.gray,border:"none",cursor:"pointer",position:"relative"}}>
              🔒 {t("groupTab")}
              {groupCount > 0 && <span style={{position:"absolute",top:"-4px",right:"-4px",width:"18px",height:"18px",background:C.coral,borderRadius:"50%",fontSize:"10px",display:"flex",alignItems:"center",justifyContent:"center",color:C.white,fontWeight:"700",border:`2px solid ${C.white}`}}>{groupCount}</span>}
            </button>
          </div>
        </div>

        {storiesLoading ? (
          <div style={{display:"flex",justifyContent:"center",padding:"40px"}}><div className="spinner"></div></div>
        ) : (
          <div style={{display:"flex",flexDirection:"column",gap:"16px"}}>
            {visibleStories.map(story => {
              const genre = GENRES.find(g => g.id === story.genre);
              return (
                <div key={story.id} onClick={() => openStory(story)} style={{background:C.white,borderRadius:"16px",overflow:"hidden",cursor:"pointer",boxShadow:"0 2px 12px rgba(10,37,51,0.08)",border:`1.5px solid ${activeTab==="group" ? "rgba(255,87,87,0.15)" : "transparent"}`}}>
                  <div style={{background: story.cover_color || `linear-gradient(135deg, ${C.teal}, ${C.navy})`, padding:"20px",display:"flex",alignItems:"center",gap:"16px"}}>
                    <div style={{fontSize:"44px"}}>{story.cover_emoji}</div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"6px"}}>
                        {story.type==="group" && <Badge bg={C.amber} color={C.navy}>🔒 {t("groupTab")}</Badge>}
                        <Badge bg="rgba(255,255,255,0.25)">{lang === "en" ? genre?.en : genre?.label}</Badge>
                        {story.finished && <Badge bg={C.mint} color={C.navy}>{t("finished")}</Badge>}
                      </div>
                      <h3 style={{color:C.white,fontWeight:"800",fontSize:"17px",margin:"0 0 3px"}} dir="auto">{story.title}</h3>
                      <p style={{color:"rgba(255,255,255,0.7)",fontSize:"12px",margin:0}}>{t("startedBy")} {story.creator_name}</p>
                    </div>
                  </div>
                  <div style={{padding:"14px 20px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <button onClick={(e) => { e.stopPropagation(); handleLike(story); }} style={{background:"none",border:"none",cursor:"pointer",fontSize:"12px",color:C.gray,fontWeight:"600",display:"flex",alignItems:"center",gap:"4px",padding:0}}><span style={{filter: myLiked(story.id) ? "none" : "grayscale(1)",opacity: myLiked(story.id) ? 1 : 0.55}}>❤️</span>{likeCount(story.id)}</button>{isAdmin && <button onClick={(e) => { e.stopPropagation(); handleDeleteStory(story); }} style={{background:"none",border:"1.5px solid #FF5757",color:"#FF5757",cursor:"pointer",fontSize:"14px",padding:"3px 10px",borderRadius:"999px"}}>🗑️</button>}
                      {!story.finished && <span style={{fontSize:"12px",background: story.type==="group" ? "rgba(255,87,87,0.1)" : C.tealLight,color: story.type==="group" ? C.coral : C.tealDark,padding:"4px 12px",borderRadius:"999px",fontWeight:"700"}}>{t("addToStory")}</span>}
                    </div>
                  </div>
                </div>
              );
            })}
            {visibleStories.length === 0 && (
              <div style={{textAlign:"center",padding:"64px 0",background:C.white,borderRadius:"16px"}}>
                <div style={{fontSize:"32px",marginBottom:"16px"}}>{activeTab==="group" ? "👥" : "📖"}</div>
                <p style={{color:C.navy,fontWeight:"700",fontSize:"16px",margin:"0 0 6px"}}>{activeTab==="group" ? t("noGroupStories") : t("noStories")}</p>
                <p style={{color:C.gray,fontSize:"14px",margin:0}}>{activeTab==="group" ? t("startWithFriends") : t("beFirst")}</p>
              </div>
            )}
          </div>
        )}
      </div>

      {showEditName && (
<div style={{position:"fixed",inset:0,background:"rgba(10,37,51,0.6)",zIndex:60,display:"flex",alignItems:"center",justifyContent:"center",padding:"16px"}}>
<div style={{background:C.white,borderRadius:"20px",padding:"24px",width:"100%",maxWidth:"400px",boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
<h3 style={{color:C.navy,fontWeight:"800",fontSize:"17px",margin:"0 0 12px"}}>{t("editName")}</h3>
<input value={editNameValue} onChange={e=>setEditNameValue(e.target.value)} maxLength={40} dir="auto" style={{...inputStyle,direction:undefined}} />
<p style={{color:C.gray,fontSize:"12px",margin:"8px 0 16px",lineHeight:"1.6"}}>{t("editNameHint")}</p>
<div style={{display:"flex",gap:"8px"}}>
<button onClick={handleSaveName} disabled={savingName} style={{flex:1,background:`linear-gradient(to right, ${C.teal}, ${C.tealDark})`,color:C.white,fontWeight:"700",padding:"12px",borderRadius:"12px",border:"none",cursor:"pointer",fontSize:"14px",opacity:savingName?0.7:1}}>{savingName ? t("pleaseWait") : t("save")}</button>
<button onClick={() => setShowEditName(false)} style={{flex:1,background:C.cream,color:C.navy,fontWeight:"700",padding:"12px",borderRadius:"12px",border:`1.5px solid ${C.lightGray}`,cursor:"pointer",fontSize:"14px"}}>{t("cancel")}</button>
</div>
</div>
</div>
)}

{showCreate && (
        <div style={{position:"fixed",inset:0,background:"rgba(10,37,51,0.6)",zIndex:50,display:"flex",alignItems:"flex-end",justifyContent:"center",padding:"16px"}}>
          <div style={{background:C.white,borderRadius:"20px 20px 16px 16px",padding:"24px",width:"100%",maxWidth:"512px",boxShadow:"0 -8px 40px rgba(0,0,0,0.2)",maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px",flexDirection:flip}}>
              <button onClick={() => { setShowCreate(false); setSelectedMembers([]); setMemberSearch(""); }} style={{background:C.cream,border:"none",color:C.navy,cursor:"pointer",width:"32px",height:"32px",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"700"}}>✕</button>
              <h3 style={{color:C.navy,fontWeight:"800",fontSize:"17px",margin:0}}>{t("startStory")}</h3>
            </div>
            <div style={{display:"flex",background:C.cream,borderRadius:"12px",overflow:"hidden",marginBottom:"20px",padding:"4px",gap:"4px"}}>
              <button onClick={() => setCreateType("public")} style={{flex:1,padding:"9px",fontSize:"13px",fontWeight:"700",background: createType==="public" ? C.teal : "transparent",color: createType==="public" ? C.white : C.gray,border:"none",cursor:"pointer",borderRadius:"9px"}}>🌐 {t("publicTab")}</button>
              <button onClick={() => setCreateType("group")} style={{flex:1,padding:"9px",fontSize:"13px",fontWeight:"700",background: createType==="group" ? C.coral : "transparent",color: createType==="group" ? C.white : C.gray,border:"none",cursor:"pointer",borderRadius:"9px"}}>🔒 {t("groupTab")}</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:"16px"}}>
              <div>
                <label style={{color:C.navy,fontSize:"13px",display:"block",marginBottom:"6px",fontWeight:"700"}}>{t("storyTitle")}</label>
                <input value={newStory.title} onChange={e=>setNewStory({...newStory,title:e.target.value})} placeholder={t("titlePlaceholder")} style={inputStyle} />
              </div>
              <div>
                <label style={{color:C.navy,fontSize:"13px",display:"block",marginBottom:"8px",fontWeight:"700"}}>{t("genre")}</label>
                <div style={{display:"flex",flexWrap:"wrap",gap:"8px"}}>
                  {GENRES.map(g => <button key={g.id} onClick={() => setNewStory({...newStory,genre:g.id})} style={{padding:"7px 14px",borderRadius:"999px",fontSize:"13px",fontWeight:"600",background: newStory.genre===g.id ? C.teal : C.cream,color: newStory.genre===g.id ? C.white : C.navy,border: newStory.genre===g.id ? "none" : `1.5px solid ${C.lightGray}`,cursor:"pointer"}}>{g.emoji} {lang === "en" ? g.en : g.label}</button>)}
                </div>
              </div>
              <div>
                <label style={{color:C.navy,fontSize:"13px",display:"block",marginBottom:"6px",fontWeight:"700"}}>{t("opening")}</label>
                <textarea value={newStory.opening} onChange={e=>setNewStory({...newStory,opening:e.target.value})} placeholder={t("openingPlaceholder")}
                  style={{...inputStyle,resize:"none"}} rows={4} />
              </div>
              {createType === "group" && (
                <div>
                  <label style={{color:C.navy,fontSize:"13px",display:"block",marginBottom:"6px",fontWeight:"700"}}>
                    {t("inviteMembers")} <span style={{color:C.gray}}>({selectedMembers.length}/9)</span>
                  </label>
                  <input value={memberSearch} onChange={e=>setMemberSearch(e.target.value)} placeholder={t("searchName")} style={{...inputStyle,marginBottom:"8px"}} />
                  <div style={{maxHeight:"160px",overflowY:"auto",display:"flex",flexDirection:"column",gap:"6px"}}>
                    {filteredForCreate.map(u => {
                      const sel = selectedMembers.includes(u.id);
                      return (
                        <div key={u.id} onClick={() => { if(sel) setSelectedMembers(p=>p.filter(id=>id!==u.id)); else if(selectedMembers.length<9) setSelectedMembers(p=>[...p,u.id]); }}
                          style={{display:"flex",flexDirection:flip,alignItems:"center",justifyContent:"space-between",borderRadius:"12px",padding:"10px 14px",cursor:"pointer",background: sel ? `${C.teal}15` : C.cream,border: sel ? `1.5px solid ${C.teal}` : `1.5px solid transparent`}}>
                          <div style={{width:"22px",height:"22px",borderRadius:"50%",border: sel ? `2px solid ${C.teal}` : `2px solid ${C.lightGray}`,background: sel ? C.teal : "transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>
                            {sel && <span style={{fontSize:"11px",color:C.white,fontWeight:"700"}}>✓</span>}
                          </div>
                          <div style={{display:"flex",alignItems:"center",gap:"10px",flexDirection:flip}}>
                            <span style={{fontSize:"14px",color:C.navy,fontWeight:"600"}}>{u.name}</span>
                            <Avatar letter={u.avatar_letter} size={30} bg={C.teal} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  {selectedMembers.length > 0 && (
                    <div style={{marginTop:"8px",display:"flex",flexWrap:"wrap",gap:"6px"}}>
                      {selectedMembers.map(id => {
                        const u = allUsers.find(u => u.id === id);
                        return u ? (
                          <span key={id} style={{background:`${C.teal}15`,color:C.tealDark,fontSize:"12px",padding:"4px 10px",borderRadius:"999px",display:"flex",alignItems:"center",gap:"4px",border:`1px solid ${C.teal}`,fontWeight:"600"}}>
                            {u.name}
                            <button onClick={() => setSelectedMembers(p=>p.filter(i=>i!==id))} style={{background:"none",border:"none",color:C.teal,cursor:"pointer",padding:0,fontSize:"16px",lineHeight:1}}>×</button>
                          </span>
                        ) : null;
                      })}
                    </div>
                  )}
                </div>
              )}
              <button onClick={handleCreateStory}
                style={{width:"100%",background: createType==="group" ? `linear-gradient(to right, ${C.coral}, ${C.amber})` : `linear-gradient(to right, ${C.teal}, ${C.tealDark})`,color: createType==="group" ? C.navy : C.white,fontWeight:"700",padding:"13px",borderRadius:"12px",border:"none",cursor:"pointer",fontSize:"14px"}}>
                {createType==="group" ? "👥 " + t("createSubmit") : "🚀 " + t("createSubmit")}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
